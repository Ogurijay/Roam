[package]
name = "roam"
description = "Roam：一套键鼠控制多台电脑"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
arboard = "3"
png = "0.18"
postcard.workspace = true
auto-launch = "0.6"
axum = "0.8"
blake3 = "1"
clap.workspace = true
iroh.workspace = true
mdns-sd = "0.21"
roam-core = { path = "../../crates/roam-core" }
roam-input = { path = "../../crates/roam-input" }
roam-proto = { path = "../../crates/roam-proto" }
serde.workspace = true
serde_json = "1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon = "0.26"
tao = "0.37"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
