[package]
name = "roam"
description = "Roam：一套键鼠控制多台电脑"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
arboard = "3"
png = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false }
semver = "1"
sha2 = "0.11"
postcard.workspace = true
auto-launch = "0.6"
axum = "0.8"
blake3 = "1"
dirs = "7"
clap.workspace = true
iroh.workspace = true
mdns-sd = "0.21"
roam-core = { path = "../../crates/roam-core" }
roam-input = { path = "../../crates/roam-input" }
roam-proto = { path = "../../crates/roam-proto" }
serde.workspace = true
serde_json = "1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon = "0.26"
tao = "0.37"
wry = "0.57"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
